trigger:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - backend/*

pr:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - backend/*

variables:
  - group: LifeSync-Secrets-Dev # Default to dev secrets
  - name: dockerRegistryServiceConnection
    value: 'dockerhub-lifesync'
  - name: imageRepository
    value: 'lifesync-backend'
  - name: containerRegistry
    value: '$(DOCKERHUB_USERNAME)'
  - name: dockerfilePath
    value: '$(Build.SourcesDirectory)/backend/Dockerfile'
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  - stage: Build
    displayName: Build and Test
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: |
              cd backend
              npm ci
              npx prisma generate
              npm run lint
              npm run build
            displayName: 'npm install, lint, and build'

          - script: |
              cd backend
              npm test -- --reporters=default --reporters=jest-junit
            displayName: 'Run unit tests'
            continueOnError: false

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)/backend'
            displayName: 'Publish test results'

          - task: PublishCodeCoverageResults@1
            inputs:
              codeCoverageTool: 'Cobertura'
              summaryFileLocation: '$(System.DefaultWorkingDirectory)/backend/coverage/cobertura-coverage.xml'
            displayName: 'Publish code coverage'

  - stage: Package
    displayName: Build and Push Docker Image
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: Docker
        displayName: Docker Build & Push
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: Docker@2
            displayName: Build and Push
            inputs:
              command: buildAndPush
              repository: $(containerRegistry)/$(imageRepository)
              dockerfile: $(dockerfilePath)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
                $(Build.SourceBranchName)-latest

  - stage: DeployDev
    displayName: Deploy to Dev
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    variables:
      - group: LifeSync-Secrets-Dev
    jobs:
      - deployment: Deploy
        displayName: Deploy to Dev Web App
        environment: 'dev'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'azure-lifesync-dev'
                    appName: 'lifesync-backend-dev'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

                - script: |
                    for i in 1 2 3; do
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lifesync-backend-dev.azurewebsites.net/api/health)
                      echo "Attempt $i: HTTP $STATUS"
                      if [ "$STATUS" = "200" ]; then echo "Health check passed"; exit 0; fi
                      sleep 10
                    done
                    echo "Health check failed after 3 attempts"
                    exit 1
                  displayName: 'Health Check'

  - stage: DeployProd
    displayName: Deploy to Prod
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: LifeSync-Secrets-Prod
    jobs:
      - deployment: Deploy
        displayName: Deploy to Prod Web App
        environment: 'prod'
        pool:
          vmImage: $(vmImageName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebAppContainer@1
                  inputs:
                    azureSubscription: 'azure-lifesync-prod'
                    appName: 'lifesync-backend-prod'
                    containers: '$(containerRegistry)/$(imageRepository):$(tag)'

                - script: |
                    for i in 1 2 3; do
                      STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lifesync-backend-prod.azurewebsites.net/api/health)
                      echo "Attempt $i: HTTP $STATUS"
                      if [ "$STATUS" = "200" ]; then echo "Health check passed"; exit 0; fi
                      sleep 10
                    done
                    echo "Health check failed after 3 attempts"
                    exit 1
                  displayName: 'Health Check'
